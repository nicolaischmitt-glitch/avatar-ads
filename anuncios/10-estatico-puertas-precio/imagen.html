<!doctype html>
<!-- Anuncio estático 10 · las dos puertas (ángulo precio). Mismo estilo que referencia-original.jpg: fondo blanco, línea negra, puerta verde y roja.
     Render (desde la raíz):  node anuncios/10-estatico-puertas-precio/render.mjs  → final/puertas-precio.png (1080×1350) -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("fonts/Inter-600.woff2") format("woff2"); font-weight: 600; }
  html, body { margin: 0; background: #fff; }
  svg { display: block; }
  .label { font-family: "Inter", sans-serif; font-weight: 600; text-anchor: middle; letter-spacing: -0.5px; }
</style>
</head>
<body>
<svg id="s" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const INK = "#151515", GREEN = "#4BA86E", RED = "#D2322D", G = 840; // G = línea del suelo
const svg = document.getElementById("s");
// ?historia → 1080×1920: la escena baja 240 px (dentro de la zona segura de las historias) y la multitud no se sale por la derecha
const HIST = location.search.includes("historia"), DY = HIST ? 240 : 0;
if (HIST) { svg.setAttribute("height", 1920); svg.setAttribute("viewBox", "0 0 1080 1920"); }
let out = "";

// Persona de espaldas, pies en (x, y), tamaño s. extra = accesorios (maletín, lentes)
function persona(x, y, s, extra = false) {
  const st = `fill="#fff" stroke="${INK}" stroke-width="${(2.3 / s).toFixed(2)}" stroke-linejoin="round" stroke-linecap="round"`;
  let p = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})">`;
  p += `<path ${st} d="M-15,-64 L-14,-8 Q-9,-5 -3,-8 L-2,-64 Z"/><path ${st} d="M2,-64 L3,-8 Q9,-5 14,-8 L15,-64 Z"/>`;
  p += `<path ${st} d="M-23,-6 Q-24,1 -14,1 L-2,1 Q0,-3 -4,-7 Z"/><path ${st} d="M3,-7 Q0,-3 2,1 L14,1 Q24,1 23,-6 Z"/>`;
  p += `<path ${st} d="M-25,-122 Q-27,-140 -10,-142 L10,-142 Q27,-140 25,-122 L24,-60 Q0,-55 -24,-60 Z"/>`;
  p += `<path ${st} fill="none" d="M-17,-126 L-19,-66 M17,-126 L19,-66"/>`;
  if (extra) p += `<path ${st} d="M23,-60 L24,-52 M18,-52 L44,-52 Q47,-52 47,-49 L47,-22 Q47,-19 44,-19 L18,-19 Q15,-19 15,-22 L15,-49 Q15,-52 18,-52 Z M15,-44 L47,-44"/>`;
  p += `<ellipse ${st} cx="-21" cy="-63" rx="4.5" ry="6"/><ellipse ${st} cx="21" cy="-63" rx="4.5" ry="6"/>`;
  p += `<path ${st} d="M-16,-160 Q-22,-158 -19,-151 Q-17,-149 -15,-151 Z"/><path ${st} d="M16,-160 Q22,-158 19,-151 Q17,-149 15,-151 Z"/>`;
  p += `<circle ${st} cx="0" cy="-160" r="17"/>`;
  if (extra) p += `<path ${st} fill="none" d="M15,-166 Q19,-165 21,-161"/>`;
  return p + `</g>`;
}

// Puerta: marco de color con esquinas redondeadas + arco negro (la entrada)
function puerta(x1, x2, top, color, arco) {
  const r = 28;
  let p = `<path fill="none" stroke="${color}" stroke-width="5" d="M${x1},${G} L${x1},${top + r} Q${x1},${top} ${x1 + r},${top} L${x2 - r},${top} Q${x2},${top} ${x2},${top + r} L${x2},${G}"/>`;
  const [a1, a2, at] = arco, rad = (a2 - a1) / 2;
  p += `<path fill="#fff" stroke="${INK}" stroke-width="4" d="M${a1},${G} L${a1},${at + rad} A${rad},${rad} 0 0 1 ${a2},${at + rad} L${a2},${G}"/>`;
  return p;
}

function texto(cx, y0, lineas, color, size) {
  return lineas.map((t, i) => `<text class="label" x="${cx}" y="${y0 + i * size * 1.08}" font-size="${size}" fill="${color}">${t}</text>`).join("");
}

// suelo
out += `<path fill="none" stroke="${INK}" stroke-width="4" d="M40,${G} L700,${G}"/>`;

// puerta verde (una sola persona)
out += puerta(95, 465, 110, GREEN, [200, 360, 390]);
out += texto(280, 205, ["PAGAR ~$1", "POR ANUNCIO"], GREEN, 50);
out += persona(280, G + 70, 1.6, true);

// puerta roja (la multitud)
out += puerta(575, 1020, 110, RED, [690, 905, 360]);
out += texto(797, 195, ["PAGARLE ~$20", "A SEEDANCE", "POR ANUNCIO"], RED, 52);

// multitud: de atrás (entrando por la puerta) hacia adelante; cada fila más grande, más ancha y desordenada
let seed = 7;
const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
for (let r = 0; r < 18; r++) {
  const s = 0.6 + r * 0.042, y = G - 6 + r * 33;
  const x0 = 690 - r * 10 + (r % 2) * 17 * s, x1 = 910 + r * 34;
  const xMax = HIST ? 1040 - 30 * s : 1120;
  for (let x = x0; x < x1 && x < xMax; x += (34 + rnd() * 10) * s)
    out += persona(x + (rnd() - 0.5) * 14 * s, y + (rnd() - 0.5) * 14, s * (0.95 + rnd() * 0.1));
}

svg.innerHTML = `<g transform="translate(0 ${DY})">${out}</g>`;
</script>
</body>
</html>
